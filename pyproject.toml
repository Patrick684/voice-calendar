[tool.ruff]
exclude = [".venv", "__pycache__", ".git", ".ruff_cache"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F841", "E402"]  # 测试脚本需先设置 sys.path 再导入项目模块
"scripts/*" = ["E402"]  # 脚本中 sys.stdout.reconfigure 需在第三方库导入前执行
